name: Faratitr Podcast (Gemini TTS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Make podcast and send to channel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python3 podcast/make_podcast.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faratitr-podcast
          path: podcast/out/
          retention-days: 7
