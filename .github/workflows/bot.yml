name: Faratitr News Bot

# هر ~۲/۵ دقیقه یک شانس اجرا (دو زمان‌بند افست‌دار — تأخیر تصادفی گیت‌هاب را جبران می‌کند)
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}   # امکان اجرای دستی برای تست

# جلوگیری از اجرای همزمان دو چرخه
concurrency:
  group: faratitr
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore archive cache
        uses: actions/cache@v4
        with:
          path: archive.json
          key: faratitr-archive-${{ github.run_id }}
          restore-keys: faratitr-archive-

      - name: Run one news cycle
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ENGINE: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: node bot.mjs --once
